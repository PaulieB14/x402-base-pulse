[package]
name = "x402_base_pulse"
version = "3.4.0"
edition = "2021"
description = "x402 Base Pulse - Real-time x402 payment protocol analytics on Base"
repository = "https://github.com/PaulieB14/x402-base-pulse"

[lib]
name = "substreams"
crate-type = ["cdylib"]

[dependencies]
# Substreams core
substreams = "0.8.0"
substreams-ethereum = "0.12.0"

# Database sink support
substreams-database-change = "5.0.0"

# Protobuf
buffa = "0.9.2"
buffa-types = "0.9.2"

# Utilities
hex-literal = "0.3"
num-bigint = "0.4"
num-traits = "0.2"

# WASM compatibility
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
lto = true
opt-level = 's'
strip = "debuginfo"
